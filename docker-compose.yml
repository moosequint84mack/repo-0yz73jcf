services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # REQUIRED in production: a long random string signing JWT tokens.
      SCREENER_JWT_SECRET: ${SCREENER_JWT_SECRET:?set SCREENER_JWT_SECRET in .env}
      # First super-user, seeded on a fresh database.
      SCREENER_ADMIN_EMAIL: ${SCREENER_ADMIN_EMAIL:-admin@screener.io}
      # If empty, a random password is generated and printed once in the logs.
      SCREENER_ADMIN_PASSWORD: ${SCREENER_ADMIN_PASSWORD:-}
      # SQLite by default; point at Postgres for scale, e.g.
      #   postgresql+psycopg://user:pass@db:5432/screener
      SCREENER_DATABASE_URL: ${SCREENER_DATABASE_URL:-sqlite:////data/screener.db}
    volumes:
      - screener-data:/data      # SQLite database
      - screener-models:/app/models  # trained LightGBM models
    expose:
      - "8000"
    # Uncomment to reach the API directly (e.g. for debugging):
    # ports:
    #   - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${SCREENER_HTTP_PORT:-8080}:80"

volumes:
  screener-data:
  screener-models:
