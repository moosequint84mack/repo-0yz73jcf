[project]
name = "crypto-screener-backend"
version = "0.1.0"
description = "Multi-exchange crypto market screener: order-book density detection, cross-exchange comparison, ML pattern prediction"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "ccxt>=4.2,<5.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.3,<2.0",
    "lightgbm>=4.0,<5.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "httpx>=0.26,<1.0",
    "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
